nexusDescription="[color=#f1c232][size=6][b]BARTER LIMIT FIX[/b][/size][/color]\n<br />\n<br />[size=3][b][color=#ff0000]Requirements[/color] \n<br />[/b]\n<br />Latest version of SKSE64\n<br />Visual C++ Redistributables 2019 \n<br />Address Library for SKSE Plugins\n<br />\n<br />[color=#f1c232][b]Description[/b][/color]\n<br />\n<br />[color=#f4f4f4]Fixes a bug that can prevent the player from receiving gold when selling to a merchant if the merchant has more than 32,767 gold. This bug can similarly prevent the player from receiving items when buying from a merchant if the merchant has more than 32,767 of said item.[/color][/size]\n<br />\n<br />[center][size=3][color=#f4f4f4][img]https://staticdelivery.nexusmods.com/mods/1704/images/77173/77173-1666183956-949987551.gif[/img][/color][/size][/center]\n<br />[size=3]\n<br />\n<br />[b][color=#f1c232]Logs[/color][/b]\n<br />\n<br />The log file will report whether the Barter Limit Fix has been installed. It will also report any warnings and errors that have been silently handled, such as conflicts with other mods.\n<br />\n<br />The log file can be found in the following directory, which can be opened in any text editor:[/size]\n<br />[list]\n<br />[*][size=3]Skyrim Special Edition/Data/SKSE/Plugins/BarterLimitFix.log[/size][/*]\n<br />[/list][size=3]\n<br />[b][color=#f1c232]Source[/color][/b][/size]\n<br />\n<br />[list]\n<br />[*][size=3][url=https://github.com/KernalsEgg/SKSE64Plugins/tree/main/BarterLimitFix/BarterLimitFix]v1.0.0 (KernalsEgg)[/url][/size][/*]\n<br />[*][url=https://github.com/powerof3/BarterLimitFix][size=3]v1.0.1 (powerofthree)[/size][/url][/*]\n<br />[/list]"
