nexusDescription="[size=3][b][color=#e69138]-[/color]\n<br />[color=#e69138]REQUIRES THE LATEST VERSION OF MY DLL LOADER TO BE INSTALLED [color=#00ff00]-IF-[/color] YOU ARE NOT USING SKSE64![/color]\n<br />[url=http://www.nexusmods.com/skyrimspecialedition/mods/3619/?]LINK HERE[/url] (DLL LOADER)\n<br />[url=http://skse.silverlock.org/]LINK HERE[/url] (SKSE64)\n<br />[color=#e69138]-[/color][/b][/size]\n<br />\n<br />[color=#1e84cc]What is this?[/color]\n<br />It's a plugin I made that re-enables achievements while using mods by patching Skyrim SE during runtime. It's designed to be version independent. \n<br />It also works on modded saves.\n<br />No more achievement warnings, no more [M]!\n<br />\n<br />[color=#ff7700][b]NOTE![/b][/color]\n<br />[b]You do not need this mod if you are using SSE Engine Fixes\n<br />I am unsure how this reacts to mod managers. You may need to copy the files manually.\n<br />In the instance that an update breaks SKSE64, it's possible this mod may still work with my dll loader.[/b]\n<br />\n<br />[b][b][color=#6aa84f]How to install[/color][/b][list=1]\n<br />[*]Install my Dll Loader manually [color=#00ff00]-OR-[/color] SKSE64.\n<br />[*]Install this mod via your mod manager.\n<br />[*]Refer to [url=https://staticdelivery.nexusmods.com/mods/1704/images/245/245-1533068186-225723585.jpeg]THIS IMAGE[/url]﻿ to make sure it's installed correctly.\n<br />[*]Play!\n<br />[/list]\n<br />[b][color=#e69138]How to uninstall[/color][/b]\n<br />[list=1]\n<br />[*]Uninstall via your mod manager.\n<br />[/list][/b]\n<br />[b][b][color=#6aa84f]How to install (MANUALLY)[/color][/b][list=1]\n<br />[*]Install my Dll Loader manually [color=#00ff00]-OR-[/color] SKSE64.\n<br />[*]Copy the Plugins &amp; SKSE folder to Skyrim SE's Data folder (SKSE folder is only required if you are not using my dll loader).\n<br />[*]Refer to [url=https://staticdelivery.nexusmods.com/mods/1704/images/245/245-1533068186-225723585.jpeg]THIS IMAGE[/url]﻿ to make sure it's installed correctly.\n<br />[*]Play!\n<br />[/list]\n<br />[b][color=#e69138]How to uninstall (MANUALLY)[/color][/b]\n<br />[list=1]\n<br />[*]Delete:\n<br />Data&#92;Plugins&#92;AchievementsModsEnabler.dll\n<br />Data&#92;Plugins&#92;AchievementsModsEnabler.ini\n<br />Data&#92;Plugins&#92;AchievementsModsEnabler.dll_Exports.txt\n<br />Data&#92;SKSE&#92;Plugins&#92;AchievementsModsEnablerLoader.dll\n<br />\n<br />[/list][/b][color=#00ffff][b]Options[/b][/color]:\n<br />AchievementsModsEnabler.ini located in Data&#92;Plugins&#92;Sumwunn contains these options:\n<br />\n<br />bEnableLogging=1\n<br />; false/0 = Disabled.\n<br />; true/1 = Enabled.\n<br />bIgnoreExpectedProcessName=0\n<br />; false/0 = Expected process name detection enabled.\n<br />; true/1 = Ignore Fallout4.exe &amp; SkyrimSE.exe (and VR) name detection. Allows mod to work regardless of EXE name.\n<br />; [b]Automatically overridden when using SKSE/F4SE[/b].\n<br />\n<br />[b][color=#1e84cc]How do I know if it's working?[/color]\n<br />You'll get no achievement warnings, and the [M] will won't appear in the saves menu (already modded saves will need to be [b][b]re-saved for [M] to disappear[/b][/b]), alternatively you can check the log just to be sure.[/b]\n<br />\n<br />After you've started Skyrim SE (you can alt-tab for this part), go to Data&#92;Plugins&#92;Sumwunn, there's a log file called: [color=#6aa84f]AchievementsModsEnabler.log.[/color]\n<br />\n<br />It will either say \"[b][color=#6aa84f]YES[/color][/b]\" or \"[color=#cc0000]NO[/color]\". Indicating whether or not the plugin successfully patched Skyrim SE. So if it says NO, lemme know!\n<br />\n<br />[b][color=#1e84cc]Will it need updating?[/color][/b]\n<br />Probably not! I've designed this to be version independent. However in the case that it does, I will have it fixed very quickly. Below is a list of Skyrim SE versions that have been tested and working.\n<br />\n<br />[b][color=#93c47d]Tested &amp; working versions w/[b] 1.2+ (AE compatible)[/b]:\n<br />[/color][/b]1.6.1170.0\n<br />1.6.1130.0\n<br />1.6.640.0\n<br />1.6.629.0\n<br />\n<br />[b][color=#93c47d]Tested &amp; working versions w/[b] 1.1+ (AE compatible)[/b]:[/color][/b]\n<br />1.6.318.0\n<br />\n<br />[b][color=#93c47d]Tested &amp; working versions w/[b] 1.0.0.8 - 1.0.1.1[/b]:[/color][/b]\n<br />1.5.39.0\n<br />1.5.3.0\n<br />1.4.2.0\n<br />1.3.9.0\n<br />1.3.5.0\n<br />1.2.39.0\n<br />1.2.36.0\n<br />1.1.51.0\n<br />1.1.47.0\n<br />\n<br />[b]Source: [url=https://github.com/Sumwunn/AchievementsModsEnabler]CODE[/url][/b]\n<br />\n<br />[b][color=#ffd966]NOTES\n<br />[/color][/b][list]\n<br />[*]Achievements are baked into the saves; any achievement you would have received most likely won't be obtainable unless you load an earlier save or start again.\n<br />[*]Sometimes after installing this your saves appear to disappear. This is due to how Bethesda sorts saves. Select \"Show all saves\" and they will appear. \n<br />[*]Unavailable for UWP and Consoles due to their locked down nature.\n<br />[*]If your save is already modded, you'll have to save again to order for the [M] to disappear.\n<br />[*]This will not get you VAC banned in any manner as Skyrim SE does not use any anti-cheat.\n<br />[*]If you have renamed your Skyrim EXE you must edit this mod's ini file to accommodate that or use SKSE64.\n<br />[*]If the mod is not working, try restarting Steam and/or your computer.\n<br />[*]The dll loader does not have to be used if using SKSE64 to launch Skyrim SE.\n<br />[/list][list]\n<br />[*]Written in C++/ASM.\n<br />[/list]\n<br />[color=#f1c232][b]CREDITS[/b]:[/color]\n<br />Bethesda for Skyrim SE. ([url=http://store.steampowered.com/app/489830/]http://store.steampowered.com/app/489830/[/url])\n<br />Microsoft for Visual Studio. ([url=https://www.visualstudio.com/]https://www.visualstudio.com/[/url])\n<br />The UASM devs. ([url=https://github.com/Terraspace/HJWasm]https://github.com/Terraspace/UASM[/url])"
